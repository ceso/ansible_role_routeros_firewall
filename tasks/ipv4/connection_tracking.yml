---
# roles/ansible_role_routeros_firewall/tasks/ipv4/connection_tracking.yml

- name: Configure IPv4 connection tracking
  community.routeros.api_modify:
    hostname: "{{ routeros_firewall_api_hostname }}"
    username: "{{ routeros_firewall_api_username }}"
    password: "{{ routeros_firewall_api_password }}"
    tls: "{{ routeros_firewall_api_tls }}"
    port: "{{ routeros_firewall_api_port }}"
    validate_certs: "{{ routeros_firewall_api_validate_certs }}"
    validate_cert_hostname: "{{ routeros_firewall_api_validate_cert_hostname }}"
    timeout: "{{ routeros_firewall_api_timeout }}"
    path: "ip firewall connection tracking"
    data:
      - "{{ routeros_firewall_ipv4_connection_tracking }}"
    handle_entries_content: remove_as_much_as_possible
  when: routeros_firewall_ipv4_connection_tracking | length > 0
  delegate_to: localhost
  register: __routeros_firewall_ipv4_conntrack_result

- name: Show IPv4 connection tracking changes
  ansible.builtin.debug:
    var: __routeros_firewall_ipv4_conntrack_result
  when: __routeros_firewall_ipv4_conntrack_result is changed

# eof
